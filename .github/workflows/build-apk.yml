name: Build worker APK
on:
  workflow_dispatch:
  push:
    paths: ['worker_app/**', 'docs/firebase-config.json']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    defaults:
      run:
        working-directory: worker_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash setup.sh
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Sign APK with the company key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out build/app/outputs/flutter-apk/attendance.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/attendance.apk | head -3

      - name: Use unsigned APK (no key configured)
        if: env.KEYSTORE_BASE64 == ''
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/attendance.apk

      - uses: actions/upload-artifact@v4
        with:
          name: worker-app-apk
          path: worker_app/build/app/outputs/flutter-apk/attendance.apk

      - name: Publish latest release (for in-app updates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/app/outputs/flutter-apk
          echo "{\"build\": ${{ github.run_number }}, \"apk\": \"https://github.com/${{ github.repository }}/releases/download/latest/attendance.apk\"}" > version.json
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest attendance.apk version.json --repo "${{ github.repository }}" --title "Latest build" --notes "Build ${{ github.run_number }}"
