name: Build worker APK
on:
  workflow_dispatch:
  push:
    paths: ['worker_app/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash setup.sh
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: worker-app-apk
          path: worker_app/build/app/outputs/flutter-apk/app-release.apk
